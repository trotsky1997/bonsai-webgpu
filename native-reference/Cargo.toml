[package]
name = "bonsai-rs"
version = "0.4.1"
edition = "2021"
autobins = false

[[bin]]
name = "bonsai-w1a2"
path = "src/main.rs"

[[bin]]
name = "bonsai-w1a4-symmetric"
path = "src/a4_main.rs"

[[bin]]
name = "bonsai-chat-worker"
path = "src/chat_main.rs"

[[bin]]
name = "bonsai-mlx-chat-worker"
path = "src/mlx_chat_main.rs"
required-features = ["mlx"]

[features]
default = []
mlx = []

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
half = "2"
memmap2 = "0.9"
rayon = "1"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
