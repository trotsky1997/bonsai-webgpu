[package]
name = "bonsai-webgpu"
version = "0.4.1"
edition = "2021"
description = "Dedicated Bonsai W1A4 inference in the browser"
license = "MIT"
repository = "https://github.com/trotsky1997/bonsai-webgpu"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bonsai-ui-core = { path = "crates/ui-core" }
wgpu = { version = "26.0.1", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Performance", "WorkerGlobalScope"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tokenizers = { version = "0.21.4", default-features = false, features = ["unstable_wasm"] }
half = "2"
ahash = "0.8"
bytemuck = { version = "1", features = ["derive"] }
futures-channel = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
